<!doctype html>
<html lang="th" data-theme="sky">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Uri Planner</title>
  <meta name="description" content="Daily planner, income & expense tracker and dashboards — personal and team.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='18' fill='%23dde9fa'/><path d='M20 24h24M20 32h16M20 40h20' stroke='%234f8ad8' stroke-width='5' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core/css/base.css">
  <link rel="stylesheet" href="core/css/shell.css">
  <!-- each module's style.css is added by core/modules.js -->
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var p = JSON.parse(localStorage.getItem('pp:prefs') || '{}');
      if (p.theme) document.documentElement.dataset.theme = p.theme;
      var dark = p.mode === 'dark' || (p.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      if (p.lang) document.documentElement.lang = p.lang;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="config/firebase-config.js"></script>

  <!-- core: shared by every module -->
  <script src="core/util.js"></script>
  <script src="core/icons.js"></script>
  <script src="core/i18n.js"></script>
  <script src="core/ui.js"></script>
  <script src="core/data.js"></script>
  <script src="core/store.js"></script>
  <script src="core/adapters/local.js"></script>
  <script src="core/adapters/firebase.js"></script>
  <script src="core/components.js"></script>
  <script src="core/modules.js"></script>

  <!-- feature modules: listed in modules/manifest.js, loaded by core/app.js -->
  <script src="modules/manifest.js"></script>
  <script src="core/app.js"></script>
</body>
</html>
